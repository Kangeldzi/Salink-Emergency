<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔍 Debug localStorage — SALINK</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    margin: 0;
    padding: 16px;
    background: #0f172a;
    color: #e2e8f0;
    line-height: 1.5;
  }
  h1 { font-size: 18px; color: #38bdf8; margin: 0 0 16px; }
  .section {
    background: #1e293b;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    border: 1px solid #334155;
  }
  .section h2 {
    font-size: 14px;
    color: #fbbf24;
    margin: 0 0 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .item {
    background: #0f172a;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    border-left: 3px solid #38bdf8;
    word-break: break-all;
  }
  .key {
    color: #38bdf8;
    font-weight: bold;
    font-size: 13px;
    margin-bottom: 4px;
    display: block;
  }
  .value {
    color: #cbd5e1;
    font-size: 12px;
    font-family: 'Courier New', monospace;
    white-space: pre-wrap;
  }
  .empty { color: #64748b; font-style: italic; font-size: 13px; }
  .badge {
    display: inline-block;
    background: #f59e0b;
    color: #0f172a;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 6px;
    font-weight: bold;
  }
  .badge-user { background: #10b981; }
  button {
    background: #38bdf8;
    color: #0f172a;
    border: none;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    margin-bottom: 8px;
  }
  button:active { opacity: 0.7; }
  button.danger { background: #ef4444; color: white; }
  .info {
    font-size: 11px;
    color: #94a3b8;
    text-align: center;
    padding: 8px;
  }
</style>
</head>
<body>

<h1>🔍 Debug localStorage SALINK</h1>

<div class="section">
  <h2>📦 LocalStorage</h2>
  <div id="localStorageList">Loading...</div>
</div>

<div class="section">
  <h2>🍪 SessionStorage</h2>
  <div id="sessionStorageList">Loading...</div>
</div>

<div class="section">
  <h2>ℹ️ Info Browser</h2>
  <div id="browserInfo">Loading...</div>
</div>

<button onclick="location.reload()">🔄 Refresh</button>
<button class="danger" onclick="clearAllStorage()">🗑️ Hapus Semua Storage (logout paksa)</button>

<div class="info">
  Halaman ini hanya untuk debug. Hapus setelah selesai.
</div>

<script>
// Kata kunci untuk deteksi key yang berisi data user
const USER_KEY_HINTS = ['user', 'salink', 'auth', 'login', 'session', 'profile', 'account', 'currentuser', 'current_user'];

function isUserKey(key) {
  const lower = key.toLowerCase();
  return USER_KEY_HINTS.some(hint => lower.includes(hint));
}

function renderStorage(storage, containerId) {
  const container = document.getElementById(containerId);
  const keys = Object.keys(storage);

  if (keys.length === 0) {
    container.innerHTML = '<div class="empty">Kosong — tidak ada data</div>';
    return;
  }

  let html = '';
  keys.forEach(key => {
    const value = storage.getItem(key) || '';
    const isUser = isUserKey(key);

    let displayValue = value;
    if (value.length > 500) displayValue = value.substring(0, 500) + '\n... (terpotong, total ' + value.length + ' char)';

    // Coba parse JSON untuk tampilan rapi
    try {
      const parsed = JSON.parse(value);
      if (typeof parsed === 'object' && parsed !== null) {
        displayValue = JSON.stringify(parsed, null, 2);
        if (displayValue.length > 800) {
          displayValue = displayValue.substring(0, 800) + '\n... (terpotong)';
        }
      }
    } catch (e) { /* bukan JSON, tampilkan apa adanya */ }

    html += `
      <div class="item">
        <span class="key">
          ${key}
          ${isUser ? '<span class="badge badge-user">👤 USER?</span>' : ''}
          <span class="badge">${value.length} char</span>
        </span>
        <div class="value">${escapeHtml(displayValue)}</div>
      </div>
    `;
  });

  container.innerHTML = html;
}

function escapeHtml(text) {
  return String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function renderBrowserInfo() {
  const info = {
    'User Agent': navigator.userAgent,
    'Platform': navigator.platform || 'unknown',
    'URL': window.location.href,
    'Origin': window.location.origin,
    'Online': navigator.onLine ? '✅ Ya' : '❌ Tidak',
    'LocalStorage tersedia': (typeof localStorage !== 'undefined') ? '✅ Ya' : '❌ Tidak',
    'SessionStorage tersedia': (typeof sessionStorage !== 'undefined') ? '✅ Ya' : '❌ Tidak',
    'Service Worker support': ('serviceWorker' in navigator) ? '✅ Ya' : '❌ Tidak',
    'Notification support': ('Notification' in window) ? '✅ Ya' : '❌ Tidak',
    'Notification permission': ('Notification' in window) ? Notification.permission : 'N/A'
  };

  let html = '';
  Object.keys(info).forEach(key => {
    html += `
      <div class="item">
        <span class="key">${escapeHtml(key)}</span>
        <div class="value">${escapeHtml(info[key])}</div>
      </div>
    `;
  });

  document.getElementById('browserInfo').innerHTML = html;
}

function clearAllStorage() {
  if (!confirm('Yakin hapus semua localStorage & sessionStorage? Ini akan logout paksa.')) return;
  localStorage.clear();
  sessionStorage.clear();
  alert('✅ Semua storage dihapus. Halaman akan refresh.');
  location.reload();
}

// Render semua
renderStorage(localStorage, 'localStorageList');
renderStorage(sessionStorage, 'sessionStorageList');
renderBrowserInfo();

// Log ke console juga (kalau bisa remote debug)
console.log('=== localStorage ===');
Object.keys(localStorage).forEach(k => console.log(k, '=', localStorage.getItem(k)));
console.log('=== sessionStorage ===');
Object.keys(sessionStorage).forEach(k => console.log(k, '=', sessionStorage.getItem(k)));
</script>

</body>
</html>
