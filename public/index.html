<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <meta name="theme-color" content="#071A2E" />
    <meta name="description" content="SALINK — Smart Alert, Link & Integrated Notification Knowledge." />
    <title>SALINK — Emergency Social Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
            background: #071A2E;
            color: #FFFFFF;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #sl-splash {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            animation: sl-fade-in 0.8s ease-out;
        }

        /* ================================================================ */
        /* LOGO SIRINE DENGAN ANIMASI BLINK MERAH-BIRU                    */
        /* ================================================================ */
        #sl-splash .sl-splash-logo {
            font-size: 72px;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: -1px;
            line-height: 1;
            display: inline-block;
            /* Animasi blink merah-biru bergantian */
            animation: sirenBlink 1.05s steps(1, end) infinite;
            will-change: transform, filter, color;
        }

        /* ================================================================ */
        /* ANIMASI SIREN BLINK - MERAH ↔ BIRU                              */
        /* ================================================================ */
        @keyframes sirenBlink {
            0%, 49% {
                color: #ff0000;
                filter: drop-shadow(0 0 20px rgba(255, 0, 0, 0.9))
                        drop-shadow(0 0 40px rgba(255, 0, 0, 0.6))
                        drop-shadow(0 0 80px rgba(255, 0, 0, 0.3));
                transform: scale(1);
            }
            50%, 100% {
                color: #00C2FF;
                filter: drop-shadow(0 0 20px rgba(0, 194, 255, 0.9))
                        drop-shadow(0 0 40px rgba(0, 194, 255, 0.6))
                        drop-shadow(0 0 80px rgba(0, 194, 255, 0.3));
                transform: scale(1.06);
            }
        }

        #sl-splash .sl-splash-sub {
            font-size: 14px;
            color: #6A8BA0;
        }

        #sl-splash .sl-splash-loader {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00C2FF;
            border-radius: 50%;
            animation: sl-spin 0.8s linear infinite;
            margin-top: 8px;
        }

        #sl-splash .sl-splash-version {
            font-size: 10px;
            color: #3A5A70;
            margin-top: 8px;
        }

        @keyframes sl-spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes sl-fade-in {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

    <div id="sl-splash">
        <div class="sl-splash-logo">🚨</div>
        <div class="sl-splash-sub">SALINK — Emergency Social Platform</div>
        <div class="sl-splash-loader"></div>
        <div class="sl-splash-version">v1.0 Enterprise</div>
    </div>

    <script>
        // Tunggu 2 detik lalu redirect ke dashboard 
        setTimeout(function() {
            window.location.href = 'dashboard.html';
        }, 2000);
    </script>

</body>
</html>
