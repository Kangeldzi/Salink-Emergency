<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0e1a">
    <meta name="description" content="SALINK — Smart Alert, Link & Integrated Notification Knowledge. Emergency Social Platform.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SALINK">
    <title>SALINK — Emergency Social Platform</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ==================================================================
           SALINK SPLASH SCREEN v10.0 — TELKOMSEL PREMIUM
           ==================================================================
           Tema    : Dark Navy + Telkomsel Red + White
           Font    : Inter + Poppins
           Layout  : Full screen splash dengan app-shell max 430px
           Animasi : Blink merah-biru (wajib), spin, glow, fade-in
           ================================================================== */

        /* ============ ROOT VARIABLES ============ */
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-card: #141b2e;
            --text-primary: #f5f7fa;
            --text-secondary: #a8b2c1;
            --text-muted: #6b7688;
            --primary: #e60012;
            --primary-glow: #ff0033;
            --accent-blue: #00c2ff;
            --accent-blue-glow: #00c2ff;
            --border-color: rgba(255,255,255,0.08);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        [data-theme="light"] {
            --bg-primary: #f5f7fa;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #0a0e1a;
            --text-secondary: #4a5568;
            --text-muted: #9aa0ab;
            --border-color: rgba(0,0,0,0.08);
        }

        /* ============ RESET ============ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: relative;
        }

        /* Background dekorasi */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -30%;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(230,0,18,0.15), transparent 70%);
            filter: blur(80px);
            animation: floatGlow 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            left: -20%;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,194,255,0.12), transparent 70%);
            filter: blur(80px);
            animation: floatGlow 10s ease-in-out infinite reverse;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes floatGlow {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-30px, 30px) scale(1.15); }
        }

        /* ============ APP SHELL ============ */
        .app-shell {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            padding: calc(20px + var(--safe-top)) 20px calc(20px + var(--safe-bottom));
        }

        /* ============ SPLASH CONTAINER ============ */
        #sl-splash {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            animation: slFadeIn 0.8s ease-out;
            width: 100%;
            max-width: 320px;
            text-align: center;
        }

        /* ============ LOGO SIRINE (BLINK MERAH-BIRU) ============ */
        .sl-splash-logo-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }

        /* Ring pulse merah */
        .sl-splash-logo-wrapper::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid rgba(230,0,18,0.4);
            animation: slRingPulse 2s ease-out infinite;
        }
        .sl-splash-logo-wrapper::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid rgba(0,194,255,0.3);
            animation: slRingPulse 2s ease-out infinite;
            animation-delay: 1s;
        }

        @keyframes slRingPulse {
            0% { transform: scale(0.85); opacity: 0.8; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        .sl-splash-logo {
            font-size: 84px;
            font-weight: 700;
            line-height: 1;
            display: inline-block;
            animation: sirenBlink 1.05s steps(1, end) infinite;
            will-change: transform, filter, color;
            position: relative;
            z-index: 2;
        }

        /* ================================================================ */
        /* ANIMASI SIREN BLINK — MERAH ↔ BIRU (WAJIB)                     */
        /* ================================================================ */
        @keyframes sirenBlink {
            0%, 49% {
                color: #ff0000;
                filter: drop-shadow(0 0 20px rgba(255, 0, 0, 0.9))
                        drop-shadow(0 0 40px rgba(255, 0, 0, 0.6))
                        drop-shadow(0 0 80px rgba(255, 0, 0, 0.3));
                transform: scale(1);
            }
            50%, 100% {
                color: #00C2FF;
                filter: drop-shadow(0 0 20px rgba(0, 194, 255, 0.9))
                        drop-shadow(0 0 40px rgba(0, 194, 255, 0.6))
                        drop-shadow(0 0 80px rgba(0, 194, 255, 0.3));
                transform: scale(1.06);
            }
        }

        /* ============ BRAND TITLE ============ */
        .sl-splash-title {
            font-family: 'Poppins', sans-serif;
            font-size: 32px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: 4px;
            line-height: 1;
            margin-top: 4px;
            background: linear-gradient(135deg, #ffffff 0%, #a8b2c1 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sl-splash-sub {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            line-height: 1.4;
            max-width: 280px;
        }

        /* ============ LOADER ============ */
        .sl-splash-loader {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 255, 255, 0.08);
            border-top-color: var(--primary);
            border-right-color: var(--primary-glow);
            border-radius: 50%;
            animation: slSpin 0.9s linear infinite;
            margin-top: 16px;
        }

        @keyframes slSpin {
            to { transform: rotate(360deg); }
        }

        /* ============ VERSION & FOOTER ============ */
        .sl-splash-version {
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            margin-top: 12px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
        }
        .sl-splash-version i {
            font-size: 8px;
            color: var(--primary);
        }

        /* ============ LOADING TEXT ============ */
        .sl-loading-text {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.3px;
            animation: slPulse 1.5s ease-in-out infinite;
        }

        @keyframes slPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* ============ DECORATION DOTS ============ */
        .sl-deco-dots {
            position: absolute;
            top: 40px;
            right: 30px;
            width: 80px;
            height: 80px;
            background-image: radial-gradient(rgba(255,255,255,.08) 1.5px, transparent 1.5px);
            background-size: 12px 12px;
            pointer-events: none;
            opacity: 0.6;
            z-index: 1;
        }
        .sl-deco-dots-bottom {
            position: absolute;
            bottom: 40px;
            left: 30px;
            width: 80px;
            height: 80px;
            background-image: radial-gradient(rgba(255,255,255,.08) 1.5px, transparent 1.5px);
            background-size: 12px 12px;
            pointer-events: none;
            opacity: 0.6;
            z-index: 1;
        }

        /* ============ FADE IN ANIMATION ============ */
        @keyframes slFadeIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* ============ PROGRESS BAR (LOADING) ============ */
        .sl-progress-container {
            width: 100%;
            max-width: 240px;
            height: 3px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 20px;
            position: relative;
        }
        .sl-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--primary-glow) 50%, var(--accent-blue) 100%);
            border-radius: 2px;
            animation: slProgress 2.2s ease-out forwards;
            box-shadow: 0 0 12px rgba(230,0,18,0.6);
        }
        @keyframes slProgress {
            0% { width: 0%; }
            40% { width: 45%; }
            70% { width: 75%; }
            100% { width: 100%; }
        }

        /* ============ REDUCED MOTION ============ */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ============ SMALL SCREEN ============ */
        @media (max-width: 360px) {
            .sl-splash-logo { font-size: 68px; }
            .sl-splash-logo-wrapper { width: 120px; height: 120px; }
            .sl-splash-title { font-size: 26px; letter-spacing: 3px; }
            .sl-splash-sub { font-size: 11px; }
        }

        /* ============ LANDSCAPE ============ */
        @media (orientation: landscape) and (max-height: 500px) {
            #sl-splash { gap: 12px; }
            .sl-splash-logo-wrapper { width: 90px; height: 90px; margin-bottom: 0; }
            .sl-splash-logo { font-size: 56px; }
            .sl-splash-title { font-size: 22px; }
            .sl-splash-loader { width: 32px; height: 32px; margin-top: 8px; }
            .sl-progress-container { margin-top: 12px; }
        }
    </style>
</head>
<body>

    <!-- DECORATION -->
    <div class="sl-deco-dots"></div>
    <div class="sl-deco-dots-bottom"></div>

    <!-- APP SHELL -->
    <div class="app-shell">

        <!-- SPLASH SCREEN -->
        <div id="sl-splash">

            <!-- Logo Sirine dengan Blink Merah-Biru -->
            <div class="sl-splash-logo-wrapper">
                <div class="sl-splash-logo">🚨</div>
            </div>

            <!-- Brand Title -->
            <div class="sl-splash-title">SALINK</div>

            <!-- Subtitle -->
            <div class="sl-splash-sub">
                Smart Alert &middot; Link &middot; Integrated Notification Knowledge
            </div>

            <!-- Progress Bar -->
            <div class="sl-progress-container">
                <div class="sl-progress-bar"></div>
            </div>

            <!-- Loader -->
            <div class="sl-splash-loader"></div>

            <!-- Loading Text -->
            <div class="sl-loading-text">Memuat aplikasi...</div>

            <!-- Version -->
            <div class="sl-splash-version">
                <i class="fas fa-circle"></i>
                v10.0 Enterprise &middot; Emergency Social Platform
            </div>

        </div>

    </div>

    <script>
        /* ==================================================================
           SALINK SPLASH — v10.0
           ==================================================================
           - Tunggu 2.5 detik → redirect ke dashboard.html
           - Skip jika user sudah login (langsung dashboard)
           - Skip jika URL punya param ?skip=1
           ================================================================== */
        (function() {
            'use strict';

            const SPLASH_DURATION = 2500; // 2.5 detik
            const DASHBOARD_URL = 'dashboard.html';
            const LOGIN_URL = 'login-register.html';

            // Cek apakah ada instruksi skip
            const params = new URLSearchParams(window.location.search);
            const skip = params.get('skip') === '1';

            // Cek apakah user sudah login
            let isLoggedIn = false;
            try {
                const user = localStorage.getItem('salink_user');
                const loggedIn = localStorage.getItem('salink_logged_in');
                if (user && loggedIn === 'true') isLoggedIn = true;
            } catch(e) {}

            // Skip splash jika ?skip=1 atau sudah login
            if (skip || isLoggedIn) {
                console.log('⚡ Splash skip — redirect langsung');
                window.location.replace(DASHBOARD_URL);
                return;
            }

            // Console log untuk debug
            console.log('🚀 SALINK Splash v10.0 — Loading...');

            // Redirect setelah durasi
            setTimeout(function() {
                console.log('✅ Splash selesai — redirect ke dashboard');
                window.location.replace(DASHBOARD_URL);
            }, SPLASH_DURATION);

            // Preload dashboard.html untuk pengalaman lebih cepat
            try {
                const link = document.createElement('link');
                link.rel = 'prefetch';
                link.href = DASHBOARD_URL;
                document.head.appendChild(link);
            } catch(e) {}

        })();
    </script>

</body>
</html>
